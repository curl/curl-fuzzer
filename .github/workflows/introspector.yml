name: Fuzz Introspector

'on':
  push:
    branches:
      - master
    paths:
      - '.github/workflows/introspector.yml'
      - 'CMakeLists.txt'
      - 'cmake/**'
      - 'fuzz_introspector_exclusion.config'
      - 'fuzzer_entrypoints/**'
      - 'ossfuzz.sh'
      - 'proto_fuzzer/**'
      - 'scripts/check_introspector_report.py'
      - 'scripts/generate_introspector_calltree.py'
      - 'scripts/compile_target.sh'
      - 'pyproject.toml'
      - 'scripts/fuzz_targets'
      - 'tests/ftp_mock_server_test.cc'
      - 'tests/ftps_mock_server_test.cc'
      - 'tests/http3_mock_server_test.cc'
      - 'tests/smtp_mock_server_test.cc'
      - 'tests/imap_mock_server_test.cc'
      - 'tests/pop3_mock_server_test.cc'
      - 'tests/mqtt_mock_server_test.cc'
      - 'tests/mqtts_mock_server_test.cc'
      - 'tests/dict_mock_server_test.cc'
      - 'tests/ldap_mock_server_test.cc'
      - 'tests/ldaps_mock_server_test.cc'
      - 'tests/rtsp_mock_server_test.cc'
      - 'tests/smtps_mock_server_test.cc'
      - 'tests/imaps_mock_server_test.cc'
      - 'tests/pop3s_mock_server_test.cc'
      - 'tests/tftp_mock_server_test.cc'
  pull_request:
    branches:
      - master
    paths:
      - '.github/workflows/introspector.yml'
      - 'CMakeLists.txt'
      - 'cmake/**'
      - 'fuzz_introspector_exclusion.config'
      - 'fuzzer_entrypoints/**'
      - 'ossfuzz.sh'
      - 'proto_fuzzer/**'
      - 'scripts/check_introspector_report.py'
      - 'scripts/generate_introspector_calltree.py'
      - 'scripts/compile_target.sh'
      - 'pyproject.toml'
      - 'scripts/fuzz_targets'
      - 'tests/ftp_mock_server_test.cc'
      - 'tests/ftps_mock_server_test.cc'
      - 'tests/http3_mock_server_test.cc'
      - 'tests/smtp_mock_server_test.cc'
      - 'tests/imap_mock_server_test.cc'
      - 'tests/pop3_mock_server_test.cc'
      - 'tests/mqtt_mock_server_test.cc'
      - 'tests/mqtts_mock_server_test.cc'
      - 'tests/dict_mock_server_test.cc'
      - 'tests/ldap_mock_server_test.cc'
      - 'tests/ldaps_mock_server_test.cc'
      - 'tests/rtsp_mock_server_test.cc'
      - 'tests/smtps_mock_server_test.cc'
      - 'tests/imaps_mock_server_test.cc'
      - 'tests/pop3s_mock_server_test.cc'
      - 'tests/tftp_mock_server_test.cc'
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

permissions: {}

env:
  DO_NOT_TRACK: '1'

jobs:
  CallGraph:
    name: 'Proto call graph'
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - name: Check out curl-fuzzer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Pin upstream source for reproducibility. Its Python dependencies are
      # maintained independently in this repository.
      - name: Check out Fuzz Introspector
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ossf/fuzz-introspector
          ref: 8bc858d7dd66f390e5bbd38c44d31fce41b72103
          path: fuzz-introspector
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: '3.14'
          cache-dependency-glob: uv.lock

      - name: Install source frontend dependencies
        run: >-
          uv sync --locked --only-group introspector
          --no-install-project --no-build

      - name: Generate focused source call graphs
        env:
          PYTHONPATH: '${{ github.workspace }}/fuzz-introspector/src'
        run: >-
          uv run --locked --no-sync python
          scripts/generate_introspector_calltree.py introspector-output

      - name: Check proto runner ancestry
        run: >-
          uv run --locked --no-sync python scripts/check_introspector_report.py
          introspector-output/

      - name: Upload diagnostic metadata
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-introspector-source-callgraph
          path: introspector-output/
          if-no-files-found: warn

  FullCallGraph:
    name: 'Full proto call graph'
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-26.04
    timeout-minutes: 120
    steps:
      - name: Check out curl-fuzzer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: curl-fuzzer
          persist-credentials: false

      - name: Check out OSS-Fuzz
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: google/oss-fuzz
          ref: 6f96dc4ca0805f56c1405e7c1606e8b73099f8b7
          path: oss-fuzz
          persist-credentials: false

      # The multi target contains both runner edges under test. Limiting the
      # build avoids exhausting a hosted runner on unrelated dependency stacks.
      - name: Build Fuzz Introspector metadata
        run: >-
          python3 oss-fuzz/infra/helper.py build_fuzzers
          --sanitizer=introspector --clean
          -e CURL_FUZZ_TARGET=curl_fuzzer_proto_multi curl
          "${GITHUB_WORKSPACE}/curl-fuzzer"

      - name: Check proto runner ancestry
        run: >-
          python3 curl-fuzzer/scripts/check_introspector_report.py
          oss-fuzz/build/out/curl/inspector/fuzzerLogFile-curl_fuzzer_proto_multi.data

      - name: Upload diagnostic metadata
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-introspector-callgraph
          path: |
            oss-fuzz/build/out/curl/inspector/summary.json
            oss-fuzz/build/out/curl/inspector/fuzzerLogFile-curl_fuzzer_proto_multi.data
          if-no-files-found: warn
