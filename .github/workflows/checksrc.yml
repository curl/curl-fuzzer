name: 'Source'

'on':
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

permissions: {}

env:
  DO_NOT_TRACK: '1'

jobs:
  linters:
    name: 'linters'
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: '3.14'
          cache-dependency-glob: uv.lock

      - name: 'install prereqs'
        run: |
          /home/linuxbrew/.linuxbrew/bin/brew install zizmor
          uv sync --locked --no-default-groups --group dev

      - name: 'zizmor GHA'
        env:
          GH_TOKEN: '${{ secrets.GITHUB_TOKEN }}'
        run: |
          eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          zizmor --pedantic .github/workflows/*.yml .github/actions/*/action.yml

      - name: 'ruff'
        run: |
          uv run --locked --no-sync ruff --version
          git ls-files '*.py' -z | xargs -0 -r uv run --locked --no-sync ruff check --

      - name: 'mypy'
        run: |
          uv run --locked --no-sync mypy --version
          git ls-files 'src/*.py' -z | xargs -0 -r uv run --locked --no-sync mypy --

  cpp-linters:
    name: 'C++ linters'
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: '3.14'
          cache-dependency-glob: uv.lock

      - name: Install schema generator dependencies
        run: uv sync --locked --no-dev

      - name: 'install prereqs'
        uses: $/.github/actions/apt-install
        with:
          packages: cmake clang-format doxygen

      # cmake configure is enough — the lint targets don't depend on any
      # ExternalProject outputs, so there's no need to build curl/openssl/etc.
      - name: 'configure'
        run: uv run --locked --no-sync cmake -B build .

      - name: 'clang-format'
        run: cmake --build build --target clang-format-check

      # always() so doxygen still runs when clang-format fails; a single CI
      # run then shows every lint failure at once instead of one-at-a-time.
      - name: 'doxygen doc-coverage'
        if: always()
        run: cmake --build build --target doxygen-check
