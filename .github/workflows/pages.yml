name: Deploy documentation to GitHub Pages

'on':
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false  # zizmor: ignore[concurrency-limits]

permissions: {}

env:
  DO_NOT_TRACK: '1'
  DOCS_SITE: ${{ vars.DOCS_SITE }}
  # renovate: datasource=crate depName=mdbook
  MDBOOK_VERSION: '0.5.4'
  # renovate: datasource=crate depName=mdbook-mermaid
  MDBOOK_MERMAID_VERSION: '0.17.1'

jobs:
  build:
    name: 'Build pages'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm

      - name: Install documentation tools
        run: |
          cargo install mdbook --version "=${MDBOOK_VERSION}" --locked
          cargo install mdbook-mermaid \
            --version "=${MDBOOK_MERMAID_VERSION}" --locked

      - name: Install dependencies
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          pip --disable-pip-version-check --no-input --no-cache-dir install --progress-bar off --prefer-binary .

      - name: Build documentation site
        run: |
          test -n "${DOCS_SITE}"
          mdbook-mermaid install .
          git diff --exit-code -- book.toml
          test -s mermaid.min.js
          test -s mermaid-init.js
          mdbook build
          python -m curl_fuzzer_tools.generate_decoder_html --output _site/corpus-decoder/index.html
          test -s _site/index.html
          test -s _site/corpus-decoder/index.html
          grep --fixed-strings --quiet '<pre class="mermaid">' _site/proto/overview.html
          grep --fixed-strings --line-regexp --quiet -- "${DOCS_SITE}" _site/CNAME

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    name: 'Deploy pages'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write     # To deploy to Pages
      id-token: write  # To verify the deployment originates from an appropriate source
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
