# Workflow used by curl/curl

name: CI

'on':
  push:
    branches:
      - master
      - main
      - '*/ci'
  pull_request:
    branches:
      - master
      - main
  # This makes the workflow callable by curl/curl
  workflow_call: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

permissions: {}

env:
  DO_NOT_TRACK: '1'

jobs:
  BuildFuzzers:
    name: 'Build fuzzers'
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.create-shards.outputs.matrix }}
    env:
      # Must match the path ossfuzz.sh writes to when CIFUZZ=True.
      CACHE_PATH: .ossfuzz-build-cache-address-x86_64
    steps:
      # Check out the caller repository (curl/curl for its caller, curl-fuzzer
      # otherwise). CIFuzz mounts this into the build container.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Check out curl-fuzzer into a subdirectory so the cache key can hash
      # the build-definition files and trim_cache.sh is available. When
      # running in curl-fuzzer, use its triggering ref; when called from
      # curl/curl, default to master.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: curl/curl-fuzzer
          ref: ${{ github.repository == 'curl/curl-fuzzer' && github.ref || '' }}
          path: .curl-fuzzer

      - name: Restore build cache
        id: build-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.CACHE_PATH }}
          key: ossfuzz-build-v2-${{ runner.os }}-address-x86_64-${{ hashFiles('.curl-fuzzer/CMakeLists.txt', '.curl-fuzzer/cmake/*.cmake', '.curl-fuzzer/scripts/compile_target.sh', '.curl-fuzzer/scripts/ossfuzzdeps.sh', '.curl-fuzzer/scripts/trim_cache.sh', '.curl-fuzzer/ossfuzz.sh') }}
          restore-keys: |
            ossfuzz-build-v2-${{ runner.os }}-address-x86_64-

      # Use the CIFuzz job to test the repository.
      - name: Build Fuzzers
        uses: google/oss-fuzz/infra/cifuzz/actions/build_fuzzers@master  # zizmor: ignore[unpinned-uses]
        with:
          oss-fuzz-project-name: 'curl'
          dry-run: false
          keep-unaffected-fuzz-targets: true

      - name: Trim build cache
        if: steps.build-cache.outputs.cache-hit != 'true'
        run: sudo .curl-fuzzer/scripts/trim_cache.sh "${CACHE_PATH}/build"

      - name: Save build cache
        if: steps.build-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.CACHE_PATH }}
          key: ossfuzz-build-v2-${{ runner.os }}-address-x86_64-${{ hashFiles('.curl-fuzzer/CMakeLists.txt', '.curl-fuzzer/cmake/*.cmake', '.curl-fuzzer/scripts/compile_target.sh', '.curl-fuzzer/scripts/ossfuzzdeps.sh', '.curl-fuzzer/scripts/trim_cache.sh', '.curl-fuzzer/ossfuzz.sh') }}

      # The tar files preserve executable permissions, which GitHub artifacts
      # do not retain on their own.
      - name: Create fuzzer shards
        id: create-shards
        run: |
          set -o pipefail
          . .curl-fuzzer/scripts/fuzz_targets
          python3 .curl-fuzzer/src/curl_fuzzer_tools/generate_matrix.py \
            --build-out build-out \
            --output-dir fuzz-shards \
            --shard-count 8 | tee "${GITHUB_OUTPUT}"
          for shard in 00 01 02 03 04 05 06 07; do
            test -f "fuzz-shards/fuzz-shard-${shard}.tar"
          done
          cp .curl-fuzzer/src/curl_fuzzer_tools/prepare_fuzzer.py fuzz-shards/

      - name: Upload fuzzer shard 00
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-shard-00
          path: |
            fuzz-shards/fuzz-shard-00.tar
            fuzz-shards/prepare_fuzzer.py
          if-no-files-found: error
          retention-days: 1

      - name: Upload fuzzer shard 01
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-shard-01
          path: |
            fuzz-shards/fuzz-shard-01.tar
            fuzz-shards/prepare_fuzzer.py
          if-no-files-found: error
          retention-days: 1

      - name: Upload fuzzer shard 02
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-shard-02
          path: |
            fuzz-shards/fuzz-shard-02.tar
            fuzz-shards/prepare_fuzzer.py
          if-no-files-found: error
          retention-days: 1

      - name: Upload fuzzer shard 03
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-shard-03
          path: |
            fuzz-shards/fuzz-shard-03.tar
            fuzz-shards/prepare_fuzzer.py
          if-no-files-found: error
          retention-days: 1

      - name: Upload fuzzer shard 04
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-shard-04
          path: |
            fuzz-shards/fuzz-shard-04.tar
            fuzz-shards/prepare_fuzzer.py
          if-no-files-found: error
          retention-days: 1

      - name: Upload fuzzer shard 05
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-shard-05
          path: |
            fuzz-shards/fuzz-shard-05.tar
            fuzz-shards/prepare_fuzzer.py
          if-no-files-found: error
          retention-days: 1

      - name: Upload fuzzer shard 06
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-shard-06
          path: |
            fuzz-shards/fuzz-shard-06.tar
            fuzz-shards/prepare_fuzzer.py
          if-no-files-found: error
          retention-days: 1

      - name: Upload fuzzer shard 07
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-shard-07
          path: |
            fuzz-shards/fuzz-shard-07.tar
            fuzz-shards/prepare_fuzzer.py
          if-no-files-found: error
          retention-days: 1

  RunFuzzers:
    name: 'Run fuzzers'
    needs: [BuildFuzzers]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.BuildFuzzers.outputs.matrix) }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        timeout-minutes: 5
        with:
          name: fuzz-shard-${{ matrix.shard }}
          path: fuzz-shards
      - name: Prepare fuzzer ${{ matrix.fuzzer }}
        env:
          MATRIX_FUZZER: '${{ matrix.fuzzer }}'
          MATRIX_SHARD: '${{ matrix.shard }}'
        run: |
          python3 fuzz-shards/prepare_fuzzer.py \
            --archive "fuzz-shards/fuzz-shard-${MATRIX_SHARD}.tar" \
            --target "${MATRIX_FUZZER}"
      - name: Display extracted files
        run: ls -laR build-out/
      - name: Run Fuzzer ${{ matrix.fuzzer }}
        uses: google/oss-fuzz/infra/cifuzz/actions/run_fuzzers@master  # zizmor: ignore[unpinned-uses]
        timeout-minutes: 6
        with:
          oss-fuzz-project-name: 'curl'
          fuzz-seconds: 120
          dry-run: false
      - name: Upload Crash
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ failure() }}
        with:
          name: artifacts-${{ matrix.fuzzer }}
          path: ./out/artifacts
          if-no-files-found: ignore

  Success:
    name: 'Success'
    # Single required status check: green only when every RunFuzzers matrix
    # leg succeeded.
    needs: [RunFuzzers]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Check RunFuzzers result
        env:
          RESULT: ${{ needs.RunFuzzers.result }}
        run: |
          if [ "${RESULT}" != "success" ]; then
            echo "RunFuzzers did not succeed: ${RESULT}"
            exit 1
          fi
          echo "All fuzzers ran successfully."
