name: Build

'on':
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

permissions: {}

env:
  DO_NOT_TRACK: '1'

jobs:
  Mainline:
    name: 'Mainline'
    strategy:
      matrix:
        sanitizer:
          - address
          - memory

    runs-on: ubuntu-26.04
    env:
      SANITIZER: ${{ matrix.sanitizer }}
      BUILD_DIR: ${{ github.workspace }}/build-${{ matrix.sanitizer }}
    steps:
      # Ubuntu 26.04 mounts /tmp as tmpfs; keep build and cache staging on disk.
      - name: Use disk-backed temporary files
        run: echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Dependencies
        uses: $/.github/actions/apt-install
        with:
          packages: cmake clang ninja-build
          tools: cmake clang clang++ ninja

      - name: Identify dependency toolchain
        id: toolchain
        shell: bash
        run: |
          {
            cat /etc/os-release
            clang --version
            clang++ --version
            cmake --version
            ninja --version
            dpkg-query -W -f='${binary:Package}=${Version}\n' \
              libc6 libc6-dev 'libstdc++-*-dev' libstdc++6 | sort
          } > "$RUNNER_TEMP/mainline-toolchain.txt"
          toolchain_hash=$(sha256sum "$RUNNER_TEMP/mainline-toolchain.txt" | cut -d ' ' -f 1)
          echo "hash=${toolchain_hash}" >> "$GITHUB_OUTPUT"

      # Exact recipe matches only: install markers do not track every flag or
      # transitive dependency version, so a prefix fallback could be stale.
      - name: Restore mainline dependencies
        id: dependency-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.BUILD_DIR }}
          key: mainline-deps-v1-${{ runner.os }}-${{ runner.arch }}-${{ matrix.sanitizer }}-${{ steps.toolchain.outputs.hash }}-${{ hashFiles('.github/workflows/build.yml', 'CMakeLists.txt', 'cmake/*.cmake', 'mainline.sh', 'scripts/compile_target.sh', 'scripts/trim_cache.sh') }}

      - name: Compile mainline
        run: ./mainline.sh

      # Keep installed libraries and protoc; remove curl checkout/build state,
      # generated files and objects so the next run still rebuilds current code.
      - name: Trim mainline dependency cache
        if: steps.dependency-cache.outputs.cache-hit != 'true'
        run: ./scripts/trim_cache.sh "$BUILD_DIR"

      - name: Save mainline dependencies
        if: steps.dependency-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.BUILD_DIR }}
          key: ${{ steps.dependency-cache.outputs.cache-primary-key }}

  just_dependencies:
    name: 'Just dependencies'
    runs-on: ubuntu-26.04
    steps:
      - name: Use disk-backed temporary files
        run: echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Dependencies
        uses: $/.github/actions/apt-install
        with:
          packages: cmake clang ninja-build
          tools: cmake clang clang++ ninja

      - name: Compile deps target
        env:
          # GMP 6.3.0's configure probes do not support GCC 15's C23 default.
          CFLAGS: -std=gnu17
        run: ./scripts/compile_target.sh deps

  PythonTests:
    name: 'Python tests'
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'

      - name: Install test dependencies
        run: pip --disable-pip-version-check --no-input --no-cache-dir install --progress-bar off --prefer-binary '.[python-tests]'

      - name: Run Python tests
        run: pytest tests/test_*.py
