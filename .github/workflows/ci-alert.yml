name: Scheduled CI

'on':
  # Periodically test the latest curl master independently of curl/curl CI.
  schedule:
    - cron: '23 3,9,15,21 * * *'  # Every six hours at :23 UTC.

permissions: {}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  ci:
    name: 'Run CI'
    uses: $/.github/workflows/ci.yml

  update-alert:
    name: 'Update scheduled CI alert'
    needs: [ci]
    # Failures open the alert; successes close an existing alert.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write  # Needed to create, assign, update, and close alert issues
    steps:
      - name: Open or resolve alert issue
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          SCHEDULED_CI_RESULT: ${{ needs.ci.result }}
          SCHEDULED_ISSUE_ASSIGNEE: ${{ vars.SCHEDULED_ISSUE_ASSIGNEE }}
        with:
          github-token: ${{ github.token }}
          retries: 3
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const result = process.env.SCHEDULED_CI_RESULT;
            const assignee = process.env.SCHEDULED_ISSUE_ASSIGNEE?.trim();
            const title = '[automation] Scheduled CI is failing';
            const marker = '<!-- curl-fuzzer-scheduled-ci-alert:v1 -->';

            // Defense in depth: this write-capable job is only for this
            // repository's scheduled wrapper workflow.
            if (context.eventName !== 'schedule') {
              core.setFailed('Refusing to process a non-scheduled run');
              return;
            }

            if (!assignee) {
              core.setFailed(
                'SCHEDULED_ISSUE_ASSIGNEE repository variable must be set'
              );
              return;
            }

            const issues = await github.paginate(
              github.rest.issues.listForRepo,
              {
                owner,
                repo,
                state: 'all',
                creator: 'github-actions[bot]',
                per_page: 100
              }
            );
            const matches = issues
              .filter(issue =>
                !issue.pull_request &&
                issue.user?.login === 'github-actions[bot]' &&
                issue.body?.includes(marker)
              )
              .sort((a, b) => a.number - b.number);
            if (matches.length > 1) {
              core.warning(
                `Found ${matches.length} scheduled-CI alerts; using #${matches[0].number}`
              );
            }
            const alert = matches[0];

            const observed = new Date().toISOString();
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/` +
              context.runId;
            const runLink = `[scheduled CI run #${context.runNumber}](${runUrl})`;
            const failureBody = [
              marker,
              `@${assignee}, the periodic curl build in curl-fuzzer is failing.`,
              '',
              `Latest failure: ${runLink}`,
              `Conclusion: \`${result}\``,
              `Commit: \`${context.sha}\``,
              `Observed: ${observed}`,
              '',
              'This issue is maintained automatically and will close after ' +
                'the next successful scheduled run.'
            ].join('\n');

            async function ensureAssignee(issue) {
              if (issue.assignees?.some(user => user.login === assignee)) {
                return;
              }
              try {
                await github.rest.issues.addAssignees({
                  owner,
                  repo,
                  issue_number: issue.number,
                  assignees: [assignee]
                });
              } catch (error) {
                // The @mention above still sends the alert if assignment is
                // unavailable or GitHub silently rejects the assignee.
                core.warning(`Could not assign @${assignee}: ${error.message}`);
              }
            }

            if (result === 'failure') {
              if (!alert) {
                const created = await github.rest.issues.create({
                  owner,
                  repo,
                  title,
                  body: failureBody
                });
                await ensureAssignee(created.data);
                core.notice(`Opened #${created.data.number}`);
              } else if (alert.state === 'closed') {
                await github.rest.issues.update({
                  owner,
                  repo,
                  issue_number: alert.number,
                  state: 'open',
                  title,
                  body: failureBody
                });
                await ensureAssignee(alert);
                await github.rest.issues.createComment({
                  owner,
                  repo,
                  issue_number: alert.number,
                  body: `@${assignee}, scheduled CI is failing again: ${runLink}.`
                });
                core.notice(`Reopened #${alert.number}`);
              } else {
                // Update the last failure without sending four duplicate
                // notifications per day while the incident remains open.
                await github.rest.issues.update({
                  owner,
                  repo,
                  issue_number: alert.number,
                  title,
                  body: failureBody
                });
                await ensureAssignee(alert);
                core.notice(`Updated open alert #${alert.number}`);
              }
              return;
            }

            if (result === 'success') {
              if (alert?.state === 'open') {
                await github.rest.issues.createComment({
                  owner,
                  repo,
                  issue_number: alert.number,
                  body: `Recovered in ${runLink} at ${observed}.`
                });
                await github.rest.issues.update({
                  owner,
                  repo,
                  issue_number: alert.number,
                  state: 'closed',
                  state_reason: 'completed'
                });
                core.notice(`Closed recovered alert #${alert.number}`);
              } else {
                core.notice('Scheduled CI is healthy; no open alert');
              }
              return;
            }

            // Cancelled or skipped results are inconclusive: do not open a
            // false incident or close a real one.
            core.notice(`Leaving alert unchanged for result: ${result}`);
