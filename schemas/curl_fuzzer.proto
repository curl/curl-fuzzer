// Restrict mutations to curl's supported transfer encoders. Arbitrary strings
// overwhelmingly exercise only curl_mime_encoder's rejection path, while an
// enum gives each real encoder enough corpus energy to reach its read/size
// implementation.
enum MimeEncoder {
  MIME_ENCODER_UNSPECIFIED = 0;
  MIME_ENCODER_BINARY = 1;
  MIME_ENCODER_8BIT = 2;
  MIME_ENCODER_7BIT = 3;
  MIME_ENCODER_BASE64 = 4;
  MIME_ENCODER_QUOTED_PRINTABLE = 5;
}

enum Scheme {
  SCHEME_UNSPECIFIED = 0;
  SCHEME_HTTP = 1;
  SCHEME_HTTPS = 2;
  SCHEME_WS = 3;
  SCHEME_WSS = 4;
  SCHEME_TELNET = 5;
  // Keep new protocols append-only: the compatibility target replays binary
  // Scenarios accumulated before these dedicated lanes existed.
  SCHEME_FTP = 6;
  SCHEME_TFTP = 7;
  SCHEME_GOPHER = 8;
  SCHEME_GOPHERS = 9;
  SCHEME_SMTP = 10;
  SCHEME_IMAP = 11;
  SCHEME_POP3 = 12;
  SCHEME_MQTT = 13;
  SCHEME_SMTPS = 14;
  SCHEME_DICT = 15;
  // The local-file protocol has no network peer. The dedicated lane pins the
  // URL path to a read-only target and exercises file:// parsing only.
  SCHEME_FILE = 16;
  // LDAP is the OpenLDAP-backed BER lane. LDAPS runs the same bind/search
  // exchange over implicit TLS, where curl's own SSL filter terminates the
  // handshake before OpenLDAP sees any BER bytes. Keep this append-only for
  // the compatibility target's historical inputs.
  SCHEME_LDAP = 17;
  SCHEME_LDAPS = 18;
  SCHEME_RTSP = 19;
  // Implicit-TLS members of the existing mail lanes. They reuse the plaintext
  // command parsers and differ only in transport setup, so the labels stay
  // append-only alongside their plaintext peers.
  SCHEME_IMAPS = 20;
  SCHEME_POP3S = 21;
  // Implicit-TLS MQTT shares the packet-aware MQTT lane; only the transport
  // factory differs. Keep this append-only for the compatibility target's
  // historical inputs.
  SCHEME_MQTTS = 22;
  // Implicit-TLS FTP shares the FTP peer and passive data-channel budget with
  // SCHEME_FTP. It is append-only so the compatibility target keeps its
  // historical raw-wire interpretation of inputs that predate this lane.
  SCHEME_FTPS = 23;
  // IPFS and IPNS are content-addressing schemes that curl's command-line
  // tool rewrites onto an HTTP gateway. The structured lane performs the same
  // rewrite against its in-process HTTP peer, so these values still describe
  // an ordinary gateway GET rather than a new wire protocol.
  SCHEME_IPFS = 24;
  SCHEME_IPNS = 25;
}

