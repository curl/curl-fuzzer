// A bounded plan for public libcurl APIs that are adjacent to, rather than
// required by, a transfer. Selectors are interpreted through typed runtime
// tables instead of being cast directly to CURLINFO or CURL_LOCK_DATA values:
// those APIs use type-dependent varargs and accepting a raw mutation would be
// undefined behaviour. Repeated fields let one transfer populate enough state
// for several probes while the API target policy removes any ignored suffix.
message ApiPlan {
  // Duplicate the configured easy handle so ownership and copied option state
  // cross curl_easy_duphandle's success and cleanup paths.
  bool duplicate_easy = 1 [
    (curl.fuzzer.schema.scenario_field) = {
      eligibility {
        profiles: TARGET_PROFILE_COMPATIBILITY
        profiles: TARGET_PROFILE_API
      }
    }
  ];
  // Reset the selected easy handle and restore the scenario's configuration
  // before transfer, exercising reset without turning the request accidental.
  bool reset_easy = 2 [
    (curl.fuzzer.schema.scenario_field) = {
      eligibility {
        profiles: TARGET_PROFILE_COMPATIBILITY
        profiles: TARGET_PROFILE_API
      }
    }
  ];
  // Create and attach a CURLSH. An empty selector list still exercises the
  // share handle's init/setopt/cleanup lifecycle.
  bool attach_share = 3 [
    (curl.fuzzer.schema.scenario_field) = {
      eligibility {
        profiles: TARGET_PROFILE_COMPATIBILITY
        profiles: TARGET_PROFILE_API
      }
    }
  ];
  repeated uint32 share_data_selectors = 4 [
    (curl.fuzzer.schema.scenario_field) = {
      eligibility {
        profiles: TARGET_PROFILE_COMPATIBILITY
        profiles: TARGET_PROFILE_API
      }
    }
  ];
  // Select one valid transfer entrypoint. The runtime owns sequencing and
  // translates readiness from its in-process peer; arbitrary raw call lists
  // would overwhelmingly describe invalid or non-progressing event loops.
  ApiDriveMode drive_mode = 5 [
    (curl.fuzzer.schema.scenario_field) = {
      eligibility {
        profiles: TARGET_PROFILE_COMPATIBILITY
        profiles: TARGET_PROFILE_API
        guards {
          fact: SELECTOR_FACT_API_VALID_MIME_REPEAT
          expected: false
          profiles: TARGET_PROFILE_API
        }
      }
    }
  ];
  // Probe curl_multi_wakeup while the multi handle is live.
  bool wake_multi = 6 [
    (curl.fuzzer.schema.scenario_field) = {
      eligibility {
        profiles: TARGET_PROFILE_COMPATIBILITY
        profiles: TARGET_PROFILE_API
        guards {
          fact: SELECTOR_FACT_API_MULTI_DRIVE
          expected: true
          profiles: TARGET_PROFILE_API
        }
        guards {
          fact: SELECTOR_FACT_API_VALID_MIME_REPEAT
          expected: false
          profiles: TARGET_PROFILE_API
        }
      }
    }
  ];
  // Each selector indexes a runtime descriptor carrying both a CURLINFO value
  // and its required output type.
  repeated uint32 easy_info_selectors = 7 [
    (curl.fuzzer.schema.scenario_field) = {
      eligibility {
        profiles: TARGET_PROFILE_COMPATIBILITY
        profiles: TARGET_PROFILE_API
      }
    }
  ];
  // Make the first response-body callback pause receiving, then resume it
  // from the bounded multi event loop. Easy-only drives clear this flag
  // because their blocking entrypoints provide no safe external resume point.
  bool pause_response_once = 8 [
    (curl.fuzzer.schema.scenario_field) = {
      eligibility {
        profiles: TARGET_PROFILE_COMPATIBILITY
        profiles: TARGET_PROFILE_API
        guards {
          fact: SELECTOR_FACT_API_MULTI_DRIVE
          expected: true
          profiles: TARGET_PROFILE_API
        }
        guards {
          fact: SELECTOR_FACT_API_VALID_MIME_REPEAT
          expected: false
          profiles: TARGET_PROFILE_API
        }
      }
    }
  ];
  // Public API probes to fire once from inside the response callback. Each
  // selector indexes a runtime table of typed calls that exercises the
  // eapi/mapi guard bookkeeping without casting selector bytes to CURLINFO or
  // other varargs values. The write callback is wrapped in CURL_CBAPI_START,
  // so it sits on multi->callstack and non-reentrant entrypoints are rejected
  // with a recursive-API-call result, even on a curl_easy_pause() replay; the
  // table still holds only calls that stay safe if the guard admits them.
  repeated uint32 reentrant_probe_selectors = 9 [
    (curl.fuzzer.schema.scenario_field) = {
      eligibility {
        profiles: TARGET_PROFILE_COMPATIBILITY
        profiles: TARGET_PROFILE_API
      }
    }
  ];
  // Exercise scheme inference through the public URL API using one fixed,
  // bounded hostname without an explicit scheme.
  bool guess_scheme_url = 10 [
    (curl.fuzzer.schema.scenario_field) = {
      eligibility {
        profiles: TARGET_PROFILE_COMPATIBILITY
        profiles: TARGET_PROFILE_API
      }
    }
  ];
  // Query the immutable public version/feature descriptor once for this
  // lifecycle. The runtime bounds feature-name traversal independently.
  bool probe_version_info = 11 [
    (curl.fuzzer.schema.scenario_field) = {
      eligibility {
        profiles: TARGET_PROFILE_COMPATIBILITY
        profiles: TARGET_PROFILE_API
      }
    }
  ];
  // Repeat a callback-backed MIME request on the same easy handle and MIME
  // tree after the first transfer completes. The API target retains this only
  // when Scenario.upload backs a top-level MIME callback part, and fixes the
  // drive to the bounded multi-perform loop. This makes public MIME rewind
  // failures observable without exposing an arbitrary call sequence.
  bool repeat_mime_post = 12 [
    (curl.fuzzer.schema.scenario_field) = {
      eligibility {
        profiles: TARGET_PROFILE_COMPATIBILITY
        profiles: TARGET_PROFILE_API
        guards {
          fact: SELECTOR_FACT_API_VALID_MIME_REPEAT
          expected: true
          profiles: TARGET_PROFILE_API
        }
      }
    }
  ];
}

// Public transfer entrypoints covered by the API lane. An enum prevents
// contradictory easy/multi flags and leaves zero as the existing multi-
// perform behavior used by every historical structured scenario.
enum ApiDriveMode {
  API_DRIVE_MULTI_PERFORM = 0;
  API_DRIVE_MULTI_SOCKET = 1;
  API_DRIVE_EASY_PERFORM = 2;
  // Debug builds expose a blocking easy entrypoint implemented on top of the
  // socket-action API. curl-fuzzer builds curl with ENABLE_DEBUG so this mode
  // is deterministic in both CI and OSS-Fuzz.
  API_DRIVE_EASY_EVENTS = 3;
  // Establish the HTTP transport without issuing a request, then exercise
  // curl_easy_send/curl_easy_recv directly against the in-process peer.
  API_DRIVE_CONNECT_ONLY = 4;
}

// A bounded shared-multi lifecycle. All handles use the containing Scenario's
// URL, options, and request body, while Connection plus subsequent_connections
// provide up to four independent peer scripts. Limiting variation to the
// scheduling controls keeps mutations focused on multi.c rather than cloning
// the complete transfer grammar for every handle.
message MultiPlan {
  // Canonicalized to the inclusive range [2, 4] by the multi target policy.
  uint32 transfer_count = 1 [
    (curl.fuzzer.schema.scenario_field) = {
      eligibility {
        profiles: TARGET_PROFILE_COMPATIBILITY
        profiles: TARGET_PROFILE_MULTI
      }
    }
  ];
  MultiDriveMode drive_mode = 2 [
    (curl.fuzzer.schema.scenario_field) = {
      eligibility {
        profiles: TARGET_PROFILE_COMPATIBILITY
        profiles: TARGET_PROFILE_MULTI
      }
    }
  ];
  // Zero preserves libcurl's default; non-zero values are capped to the
  // transfer count so mutations efficiently explore queueing boundaries.
  uint32 max_host_connections = 3 [
    (curl.fuzzer.schema.scenario_field) = {
      eligibility {
        profiles: TARGET_PROFILE_COMPATIBILITY
        profiles: TARGET_PROFILE_MULTI
      }
    }
  ];
  uint32 max_total_connections = 4 [
    (curl.fuzzer.schema.scenario_field) = {
      eligibility {
        profiles: TARGET_PROFILE_COMPATIBILITY
        profiles: TARGET_PROFILE_MULTI
      }
    }
  ];
  // CURLMOPT_MAXCONNECTS controls the size of the shared connection cache.
  // Zero retains libcurl's default and non-zero values are runtime-bounded.
  uint32 connection_cache_size = 5 [
    (curl.fuzzer.schema.scenario_field) = {
      eligibility {
        profiles: TARGET_PROFILE_COMPATIBILITY
        profiles: TARGET_PROFILE_MULTI
      }
    }
  ];
  // Ask the peer not to half-close completed responses, making an HTTP/1.1
  // connection eligible for reuse by a queued handle.
  bool keep_connections_open = 6 [
    (curl.fuzzer.schema.scenario_field) = {
      eligibility {
        profiles: TARGET_PROFILE_COMPATIBILITY
        profiles: TARGET_PROFILE_MULTI
      }
    }
  ];
  // Enable CURLPIPE_MULTIPLEX on the multi handle. The plaintext seeds remain
  // HTTP/1.1, but mutations can combine this setting with HTTP version options.
  bool multiplex = 7 [
    (curl.fuzzer.schema.scenario_field) = {
      eligibility {
        profiles: TARGET_PROFILE_COMPATIBILITY
        profiles: TARGET_PROFILE_MULTI
      }
    }
  ];
  bool wake_multi = 8 [
    (curl.fuzzer.schema.scenario_field) = {
      eligibility {
        profiles: TARGET_PROFILE_COMPATIBILITY
        profiles: TARGET_PROFILE_MULTI
      }
    }
  ];
  // One action is consumed per bounded event-loop turn. Ordered actions can
  // therefore pause then resume, or remove then re-add, the same easy handle.
  repeated MultiAction actions = 9 [
    (curl.fuzzer.schema.scenario_field) = {
      eligibility {
        profiles: TARGET_PROFILE_COMPATIBILITY
        profiles: TARGET_PROFILE_MULTI
      }
    }
  ];
  // Select a closed, harness-owned generic state-machine probe. The non-zero
  // profile redirects curl's internal progress meter to an anonymous stream,
  // applies a fixed receive limit, and shortens the transfer timeout. Keeping
  // those controls out of SetOption prevents arbitrary mutations from turning
  // other targets into slow or noisy transfers.
  MultiStateProbeProfile state_probe_profile = 10 [
    (curl.fuzzer.schema.scenario_field) = {
      eligibility {
        profiles: TARGET_PROFILE_COMPATIBILITY
        profiles: TARGET_PROFILE_MULTI
      }
    }
  ];
}

enum MultiDriveMode {
  MULTI_DRIVE_PERFORM = 0;
  MULTI_DRIVE_SOCKET = 1;
}

enum MultiStateProbeProfile {
  MULTI_STATE_PROBE_NONE = 0;
  MULTI_STATE_PROBE_PROGRESS_RATE_LIMIT = 1;
}

message MultiAction {
  // Folded into the configured handle count after mutation.
  uint32 transfer_selector = 1 [
    (curl.fuzzer.schema.scenario_field) = {
      eligibility {
        profiles: TARGET_PROFILE_COMPATIBILITY
        profiles: TARGET_PROFILE_MULTI
      }
    }
  ];
  MultiActionKind kind = 2 [
    (curl.fuzzer.schema.scenario_field) = {
      eligibility {
        profiles: TARGET_PROFILE_COMPATIBILITY
        profiles: TARGET_PROFILE_MULTI
      }
    }
  ];
}

enum MultiActionKind {
  MULTI_ACTION_NONE = 0;
  MULTI_ACTION_PAUSE_RECV = 1;
  MULTI_ACTION_PAUSE_SEND = 2;
  MULTI_ACTION_PAUSE_ALL = 3;
  MULTI_ACTION_RESUME = 4;
  MULTI_ACTION_REMOVE = 5;
  MULTI_ACTION_READD = 6;
}

// A bounded source for CURLOPT_READFUNCTION. The payload and read-limit list
// are capped again by both the target postprocessor and runtime because proto
// repeated/bytes fields have no intrinsic complexity limit.
message UploadScript {
  // Binary bytes returned to curl. Unlike POSTFIELDS this remains callback
  // backed, so redirects and authentication retries exercise seek/rewind.
  bytes data = 1 [
    (curl.fuzzer.schema.scenario_field) = {
      eligibility {
        profiles: TARGET_PROFILE_COMPATIBILITY
        profiles: TARGET_PROFILE_DEEP_HTTP
        profiles: TARGET_PROFILE_FAST_HTTPS
        profiles: TARGET_PROFILE_HTTPS_H2
        profiles: TARGET_PROFILE_FAST_HTTP2
        profiles: TARGET_PROFILE_FAST_HTTP3
        profiles: TARGET_PROFILE_H2_PROXY
        profiles: TARGET_PROFILE_FAST_WEBSOCKET
        profiles: TARGET_PROFILE_FAST_SECURE_WEBSOCKET
        profiles: TARGET_PROFILE_FAST_TELNET
        profiles: TARGET_PROFILE_FAST_FTP
        profiles: TARGET_PROFILE_FAST_TFTP
        profiles: TARGET_PROFILE_FAST_SMTP
        profiles: TARGET_PROFILE_FAST_IMAP
        profiles: TARGET_PROFILE_FAST_FILE
        profiles: TARGET_PROFILE_FAST_RTSP
        profiles: TARGET_PROFILE_API
        profiles: TARGET_PROFILE_MULTI
        profiles: TARGET_PROFILE_TIMING
      }
    }
  ];
  // Per-callback maximums used in order. A zero entry means one byte: proto3
  // makes zero especially easy to mutate into, and treating it as immediate
  // EOF would hide the configured terminal outcome and all later steps.
  // Once this list is exhausted, reads use curl's requested buffer capacity.
  repeated uint32 read_sizes = 2 [
    (curl.fuzzer.schema.scenario_field) = {
      eligibility {
        profiles: TARGET_PROFILE_COMPATIBILITY
        profiles: TARGET_PROFILE_DEEP_HTTP
        profiles: TARGET_PROFILE_FAST_HTTPS
        profiles: TARGET_PROFILE_HTTPS_H2
        profiles: TARGET_PROFILE_FAST_HTTP2
        profiles: TARGET_PROFILE_FAST_HTTP3
        profiles: TARGET_PROFILE_H2_PROXY
        profiles: TARGET_PROFILE_FAST_WEBSOCKET
        profiles: TARGET_PROFILE_FAST_SECURE_WEBSOCKET
        profiles: TARGET_PROFILE_FAST_TELNET
        profiles: TARGET_PROFILE_FAST_FTP
        profiles: TARGET_PROFILE_FAST_TFTP
        profiles: TARGET_PROFILE_FAST_SMTP
        profiles: TARGET_PROFILE_FAST_IMAP
        profiles: TARGET_PROFILE_FAST_FILE
        profiles: TARGET_PROFILE_FAST_RTSP
        profiles: TARGET_PROFILE_API
        profiles: TARGET_PROFILE_MULTI
        profiles: TARGET_PROFILE_TIMING
      }
    }
  ];
  UploadTerminal terminal = 3 [
    (curl.fuzzer.schema.scenario_field) = {
      eligibility {
        profiles: TARGET_PROFILE_COMPATIBILITY
        profiles: TARGET_PROFILE_DEEP_HTTP
        profiles: TARGET_PROFILE_FAST_HTTPS
        profiles: TARGET_PROFILE_HTTPS_H2
        profiles: TARGET_PROFILE_FAST_HTTP2
        profiles: TARGET_PROFILE_FAST_HTTP3
        profiles: TARGET_PROFILE_H2_PROXY
        profiles: TARGET_PROFILE_FAST_WEBSOCKET
        profiles: TARGET_PROFILE_FAST_SECURE_WEBSOCKET
        profiles: TARGET_PROFILE_FAST_TELNET
        profiles: TARGET_PROFILE_FAST_FTP
        profiles: TARGET_PROFILE_FAST_TFTP
        profiles: TARGET_PROFILE_FAST_SMTP
        profiles: TARGET_PROFILE_FAST_IMAP
        profiles: TARGET_PROFILE_FAST_FILE
        profiles: TARGET_PROFILE_FAST_RTSP
        profiles: TARGET_PROFILE_API
        profiles: TARGET_PROFILE_MULTI
        profiles: TARGET_PROFILE_TIMING
      }
    }
  ];
  UploadSeekResult seek_result = 4 [
    (curl.fuzzer.schema.scenario_field) = {
      eligibility {
        profiles: TARGET_PROFILE_COMPATIBILITY
        profiles: TARGET_PROFILE_DEEP_HTTP
        profiles: TARGET_PROFILE_FAST_HTTPS
        profiles: TARGET_PROFILE_HTTPS_H2
        profiles: TARGET_PROFILE_FAST_HTTP2
        profiles: TARGET_PROFILE_FAST_HTTP3
        profiles: TARGET_PROFILE_H2_PROXY
        profiles: TARGET_PROFILE_FAST_WEBSOCKET
        profiles: TARGET_PROFILE_FAST_SECURE_WEBSOCKET
        profiles: TARGET_PROFILE_FAST_TELNET
        profiles: TARGET_PROFILE_FAST_FTP
        profiles: TARGET_PROFILE_FAST_TFTP
        profiles: TARGET_PROFILE_FAST_SMTP
        profiles: TARGET_PROFILE_FAST_IMAP
        profiles: TARGET_PROFILE_FAST_FILE
        profiles: TARGET_PROFILE_FAST_RTSP
        profiles: TARGET_PROFILE_API
        profiles: TARGET_PROFILE_MULTI
        profiles: TARGET_PROFILE_TIMING
      }
    }
  ];
}

// What the read callback reports after all scripted bytes have been consumed.
// PAUSE is honored only by TELNET, whose synchronous loop treats it as no
// input for the current poll. The TELNET mock has already half-closed its peer,
// so the next poll observes EOF without requiring an asynchronous resume
// source. Other schemes canonicalize it to EOF so it cannot turn a fast
// event-driven fuzz case into a wall-clock timeout.
enum UploadTerminal {
  UPLOAD_TERMINAL_EOF = 0;
  UPLOAD_TERMINAL_ABORT = 1;
  UPLOAD_TERMINAL_PAUSE = 2;
}

// Results available to CURLOPT_SEEKFUNCTION. An OK result performs bounded
// real seeks, including rewind-to-zero, while the other values enter curl's
// fallback and terminal retry paths without consulting the filesystem.
enum UploadSeekResult {
  UPLOAD_SEEK_OK = 0;
  UPLOAD_SEEK_CANTSEEK = 1;
  UPLOAD_SEEK_FAIL = 2;
}

// A multipart request body. Runtime budgets cap both this list and the total
// number of parts constructed, since protobuf itself does not bound repeated
// field cardinality.
message MimePost {
  repeated MimePart parts = 1 [
    (curl.fuzzer.schema.scenario_field) = {
      eligibility {
        profiles: TARGET_PROFILE_COMPATIBILITY
        profiles: TARGET_PROFILE_DEEP_HTTP
        profiles: TARGET_PROFILE_FAST_HTTPS
        profiles: TARGET_PROFILE_HTTPS_H2
        profiles: TARGET_PROFILE_FAST_HTTP2
        profiles: TARGET_PROFILE_FAST_HTTP3
        profiles: TARGET_PROFILE_H2_PROXY
        profiles: TARGET_PROFILE_FAST_SMTP
        profiles: TARGET_PROFILE_FAST_IMAP
        profiles: TARGET_PROFILE_API
        profiles: TARGET_PROFILE_MULTI
        profiles: TARGET_PROFILE_TIMING
      }
    }
  ];
}

// One top-level MIME part. The content oneof makes mutations choose between
// ordinary data and a nested multipart instead of constructing contradictory
// content sources. Nesting is intentionally limited to one level in the
// schema: that is enough to enter curl's recursive MIME paths while preventing
// a recursively-shaped protobuf from consuming a fuzz iteration in parsing or
// destruction before curl sees it.
message MimePart {
  bytes name = 1 [
    (curl.fuzzer.schema.scenario_field) = {
      eligibility {
        profiles: TARGET_PROFILE_COMPATIBILITY
        profiles: TARGET_PROFILE_DEEP_HTTP
        profiles: TARGET_PROFILE_FAST_HTTPS
        profiles: TARGET_PROFILE_HTTPS_H2
        profiles: TARGET_PROFILE_FAST_HTTP2
        profiles: TARGET_PROFILE_FAST_HTTP3
        profiles: TARGET_PROFILE_H2_PROXY
        profiles: TARGET_PROFILE_FAST_SMTP
        profiles: TARGET_PROFILE_FAST_IMAP
        profiles: TARGET_PROFILE_API
        profiles: TARGET_PROFILE_MULTI
        profiles: TARGET_PROFILE_TIMING
      }
    }
  ];
  oneof content {
    bytes data = 2 [
      (curl.fuzzer.schema.scenario_field) = {
        eligibility {
          profiles: TARGET_PROFILE_COMPATIBILITY
