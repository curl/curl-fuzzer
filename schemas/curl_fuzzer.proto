// Structured network scenario description for the curl-fuzzer
// libprotobuf-mutator targets. One scenario configures a single easy handle
// and feeds one or more bounded mock connections.

message Scenario {
  // Scheme + host_path compose the request URL. Splitting them keeps the
  // mutator honest: it can vary the scheme (and therefore the dispatch path
  // in the runner) independently of the rest of the URL, without hand-rolled
  // string matching to discover ws:// vs http://.
  Scheme scheme = 1 [
    (curl.fuzzer.schema.scenario_field) = {
      eligibility {
        profiles: TARGET_PROFILE_COMPATIBILITY
        profiles: TARGET_PROFILE_FAST_FTP
        profiles: TARGET_PROFILE_FAST_SMTP
        profiles: TARGET_PROFILE_FAST_IMAP
        profiles: TARGET_PROFILE_FAST_POP3
        profiles: TARGET_PROFILE_FAST_MQTT
        profiles: TARGET_PROFILE_FAST_GOPHER
        profiles: TARGET_PROFILE_FAST_LDAP
        profiles: TARGET_PROFILE_FAST_IPFS
        profiles: TARGET_PROFILE_TIMING
      }
    }
  ];
  // Everything after the "://" — host, optional port, and path. The runner
  // does not validate or percent-encode this; bytes land on the wire as-is.
  // Declared as `bytes` rather than `string` because a libFuzzer / LPM mutator
  // will cheerfully produce non-UTF-8 byte sequences here, and proto3's
  // `string` validator warns on those at parse time even though the bytes are
  // preserved. Using `bytes` skips the validator; curl's URL parser is happy
  // with raw bytes and will reject anything invalid itself.
  bytes host_path = 2 [
    (curl.fuzzer.schema.scenario_field) = {
      eligibility {
        profiles: TARGET_PROFILE_COMPATIBILITY
        profiles: TARGET_PROFILE_FAST_HTTP
        profiles: TARGET_PROFILE_DEEP_HTTP
        profiles: TARGET_PROFILE_FAST_HTTPS
        profiles: TARGET_PROFILE_HTTPS_H2
        profiles: TARGET_PROFILE_FAST_HTTP2
        profiles: TARGET_PROFILE_FAST_HTTP3
        profiles: TARGET_PROFILE_H2_PROXY
        profiles: TARGET_PROFILE_PROXY_TRANSPORT
        profiles: TARGET_PROFILE_RESOLVER
        profiles: TARGET_PROFILE_FAST_WEBSOCKET
        profiles: TARGET_PROFILE_FAST_SECURE_WEBSOCKET
        profiles: TARGET_PROFILE_FAST_TELNET
        profiles: TARGET_PROFILE_FAST_FTP
        profiles: TARGET_PROFILE_FAST_TFTP
        profiles: TARGET_PROFILE_FAST_SMTP
        profiles: TARGET_PROFILE_FAST_IMAP
        profiles: TARGET_PROFILE_FAST_POP3
        profiles: TARGET_PROFILE_FAST_MQTT
        profiles: TARGET_PROFILE_FAST_DICT
        profiles: TARGET_PROFILE_FAST_GOPHER
        profiles: TARGET_PROFILE_FAST_LDAP
        profiles: TARGET_PROFILE_FAST_RTSP
        profiles: TARGET_PROFILE_FAST_IPFS
        profiles: TARGET_PROFILE_API
        profiles: TARGET_PROFILE_MULTI
        profiles: TARGET_PROFILE_TIMING
      }
    }
  ];
  repeated SetOption options = 3 [
    (curl.fuzzer.schema.scenario_field) = {
      eligibility {
        profiles: TARGET_PROFILE_COMPATIBILITY
        profiles: TARGET_PROFILE_FAST_HTTP
        profiles: TARGET_PROFILE_DEEP_HTTP
        profiles: TARGET_PROFILE_FAST_HTTPS
        profiles: TARGET_PROFILE_HTTPS_H2
        profiles: TARGET_PROFILE_FAST_HTTP2
        profiles: TARGET_PROFILE_FAST_HTTP3
        profiles: TARGET_PROFILE_H2_PROXY
        profiles: TARGET_PROFILE_PROXY_TRANSPORT
        profiles: TARGET_PROFILE_RESOLVER
        profiles: TARGET_PROFILE_FAST_WEBSOCKET
        profiles: TARGET_PROFILE_FAST_SECURE_WEBSOCKET
        profiles: TARGET_PROFILE_FAST_TELNET
        profiles: TARGET_PROFILE_FAST_FTP
        profiles: TARGET_PROFILE_FAST_TFTP
        profiles: TARGET_PROFILE_FAST_SMTP
        profiles: TARGET_PROFILE_FAST_IMAP
        profiles: TARGET_PROFILE_FAST_POP3
        profiles: TARGET_PROFILE_FAST_MQTT
        profiles: TARGET_PROFILE_FAST_DICT
        profiles: TARGET_PROFILE_FAST_GOPHER
        profiles: TARGET_PROFILE_FAST_FILE
        profiles: TARGET_PROFILE_FAST_LDAP
        profiles: TARGET_PROFILE_FAST_RTSP
        profiles: TARGET_PROFILE_FAST_IPFS
        profiles: TARGET_PROFILE_API
        profiles: TARGET_PROFILE_MULTI
        profiles: TARGET_PROFILE_TIMING
      }
    }
  ];
  Connection connection = 4 [
    (curl.fuzzer.schema.scenario_field) = {
      eligibility {
        profiles: TARGET_PROFILE_COMPATIBILITY
        profiles: TARGET_PROFILE_FAST_HTTP
        profiles: TARGET_PROFILE_DEEP_HTTP
        profiles: TARGET_PROFILE_FAST_HTTPS
        profiles: TARGET_PROFILE_HTTPS_H2
        profiles: TARGET_PROFILE_FAST_HTTP2
        profiles: TARGET_PROFILE_FAST_HTTP3
        profiles: TARGET_PROFILE_H2_PROXY
        profiles: TARGET_PROFILE_PROXY_TRANSPORT
        profiles: TARGET_PROFILE_RESOLVER
        profiles: TARGET_PROFILE_FAST_WEBSOCKET
        profiles: TARGET_PROFILE_FAST_SECURE_WEBSOCKET
        profiles: TARGET_PROFILE_FAST_TELNET
        profiles: TARGET_PROFILE_FAST_FTP
        profiles: TARGET_PROFILE_FAST_TFTP
        profiles: TARGET_PROFILE_FAST_SMTP
        profiles: TARGET_PROFILE_FAST_IMAP
        profiles: TARGET_PROFILE_FAST_POP3
        profiles: TARGET_PROFILE_FAST_MQTT
        profiles: TARGET_PROFILE_FAST_DICT
        profiles: TARGET_PROFILE_FAST_GOPHER
        profiles: TARGET_PROFILE_FAST_LDAP
        profiles: TARGET_PROFILE_FAST_RTSP
        profiles: TARGET_PROFILE_FAST_IPFS
        profiles: TARGET_PROFILE_API
        profiles: TARGET_PROFILE_MULTI
        profiles: TARGET_PROFILE_TIMING
        guards {
          fact: SELECTOR_FACT_HTTP3_CONNECT_UDP_PROXY
          expected: true
          profiles: TARGET_PROFILE_FAST_HTTP3
        }
      }
      child_context: "primary"
    }
  ];
  // Request headers need pointer-valued CURLOPT_HTTPHEADER state and cannot
  // safely travel through the scalar SetOption path. The runner keeps the
  // generated curl_slist alive until the transfer has completely stopped.
  // A runtime entry/length budget prevents repeated-field mutations from
  // turning header construction into the dominant cost of a fuzz iteration.
  repeated bytes request_headers = 5 [
    (curl.fuzzer.schema.scenario_field) = {
      eligibility {
        profiles: TARGET_PROFILE_COMPATIBILITY
        profiles: TARGET_PROFILE_FAST_HTTP
        profiles: TARGET_PROFILE_DEEP_HTTP
        profiles: TARGET_PROFILE_FAST_HTTPS
        profiles: TARGET_PROFILE_HTTPS_H2
        profiles: TARGET_PROFILE_FAST_HTTP2
        profiles: TARGET_PROFILE_FAST_HTTP3
        profiles: TARGET_PROFILE_H2_PROXY
        profiles: TARGET_PROFILE_PROXY_TRANSPORT
        profiles: TARGET_PROFILE_RESOLVER
        profiles: TARGET_PROFILE_FAST_WEBSOCKET
        profiles: TARGET_PROFILE_FAST_SECURE_WEBSOCKET
        profiles: TARGET_PROFILE_FAST_RTSP
        profiles: TARGET_PROFILE_FAST_IPFS
        profiles: TARGET_PROFILE_API
        profiles: TARGET_PROFILE_MULTI
        profiles: TARGET_PROFILE_TIMING
      }
    }
  ];
  // Schema-native MIME reaches curl's multipart generator without teaching
  // the generic option layer about pointer ownership. This is a message (not
  // a repeated field directly on Scenario) so presence can intentionally
  // request an empty multipart body, which exercises a distinct curl path.
  MimePost mime_post = 6 [
    (curl.fuzzer.schema.scenario_field) = {
      eligibility {
        profiles: TARGET_PROFILE_COMPATIBILITY
        profiles: TARGET_PROFILE_DEEP_HTTP
        profiles: TARGET_PROFILE_FAST_HTTPS
        profiles: TARGET_PROFILE_HTTPS_H2
        profiles: TARGET_PROFILE_FAST_HTTP2
        profiles: TARGET_PROFILE_FAST_HTTP3
        profiles: TARGET_PROFILE_H2_PROXY
        profiles: TARGET_PROFILE_FAST_SMTP
        profiles: TARGET_PROFILE_FAST_IMAP
        profiles: TARGET_PROFILE_API
        profiles: TARGET_PROFILE_MULTI
        profiles: TARGET_PROFILE_TIMING
        guards {
          fact: SELECTOR_FACT_TIMING_WEBSOCKET
          expected: false
          profiles: TARGET_PROFILE_TIMING
        }
      }
    }
  ];
  // Fresh HTTP sockets opened by redirects, authentication retries, and
  // connection-close responses consume these scripts in order. This is a
  // repeated Connection rather than a recursive Scenario so mutations cannot
  // create unbounded transfer trees or alter easy-handle options mid-flight.
  // The HTTP runtime consumes only the first three entries (four sockets total
  // including `connection`); WebSocket targets deliberately ignore this field
  // because their manual-drive state is tied to one upgraded connection.
  repeated Connection subsequent_connections = 7 [
    (curl.fuzzer.schema.scenario_field) = {
      eligibility {
        profiles: TARGET_PROFILE_COMPATIBILITY
        profiles: TARGET_PROFILE_DEEP_HTTP
        profiles: TARGET_PROFILE_FAST_HTTPS
        profiles: TARGET_PROFILE_FAST_FTP
        profiles: TARGET_PROFILE_API
        profiles: TARGET_PROFILE_MULTI
        profiles: TARGET_PROFILE_TIMING
        guards {
          fact: SELECTOR_FACT_TIMING_WEBSOCKET
          expected: false
          profiles: TARGET_PROFILE_TIMING
        }
      }
      child_context: "subsequent"
    }
  ];
  // Request-body callbacks need mutable cursor state that must outlive every
  // redirect/authentication retry. Keeping that state schema-native lets LPM
  // mutate short-read and rewind behaviour together with the server responses
  // that provoke it; a fixed callback can only ever cover one happy path.
  // When absent, non-TELNET runtimes preserve the historical deterministic
  // 16 KiB stream so old corpus entries and WebSocket upload probes retain
  // their behaviour. TELNET instead reports immediate EOF because any
  // fallback bytes would turn an absent input into unsolicited terminal data.
  UploadScript upload = 8 [
    (curl.fuzzer.schema.scenario_field) = {
      eligibility {
        profiles: TARGET_PROFILE_COMPATIBILITY
        profiles: TARGET_PROFILE_DEEP_HTTP
        profiles: TARGET_PROFILE_FAST_HTTPS
        profiles: TARGET_PROFILE_HTTPS_H2
        profiles: TARGET_PROFILE_FAST_HTTP2
        profiles: TARGET_PROFILE_FAST_HTTP3
        profiles: TARGET_PROFILE_H2_PROXY
        profiles: TARGET_PROFILE_FAST_WEBSOCKET
        profiles: TARGET_PROFILE_FAST_SECURE_WEBSOCKET
        profiles: TARGET_PROFILE_FAST_TELNET
        profiles: TARGET_PROFILE_FAST_FTP
        profiles: TARGET_PROFILE_FAST_TFTP
        profiles: TARGET_PROFILE_FAST_SMTP
        profiles: TARGET_PROFILE_FAST_IMAP
        profiles: TARGET_PROFILE_FAST_FILE
        profiles: TARGET_PROFILE_FAST_RTSP
        profiles: TARGET_PROFILE_API
        profiles: TARGET_PROFILE_MULTI
        profiles: TARGET_PROFILE_TIMING
      }
    }
  ];
  // CURLOPT_TELNETOPTIONS is a curl_slist whose strings must outlive the
  // transfer, so it cannot use the scalar SetOption path. Keeping the list
  // schema-native also lets mutations correlate local preferences such as
  // TTYPE/NAWS with the peer negotiation bytes that request those values.
  // Non-TELNET target policies discard this field before execution.
  repeated bytes telnet_options = 9 [
    (curl.fuzzer.schema.scenario_field) = {
      eligibility {
        profiles: TARGET_PROFILE_COMPATIBILITY
        profiles: TARGET_PROFILE_FAST_TELNET
      }
    }
  ];
  // Public API lifecycle calls are kept in a dedicated coverage lane because
  // duplicating/resetting handles, share-handle bookkeeping, and socket-mode
  // multi driving add useful reachability but would tax every protocol parser
  // iteration if they were unconditional. Fixed non-API target policies clear
  // this plan; curl_fuzzer_proto_api retains and bounds it after mutation.
  ApiPlan api_plan = 10 [
    (curl.fuzzer.schema.scenario_field) = {
      eligibility {
        profiles: TARGET_PROFILE_COMPATIBILITY
        profiles: TARGET_PROFILE_API
      }
    }
  ];
  // Concurrent easy-handle scheduling has a separate coverage lane so its
  // extra handles and connection-cache work do not reduce parser throughput
  // in the protocol targets. curl_fuzzer_proto_multi retains this plan and
  // applies the same request/response shape to a small set of easy handles.
  MultiPlan multi_plan = 11 [
    (curl.fuzzer.schema.scenario_field) = {
      eligibility {
        profiles: TARGET_PROFILE_COMPATIBILITY
        profiles: TARGET_PROFILE_MULTI
      }
    }
  ];
  // Select the fixed certificate chain served by dedicated TLS peers,
  // including HTTPS, secure WebSocket, and QUIC lanes.
  // Keeping this a closed profile rather than fuzzing PEM bytes makes every
  // choice a parseable TLS handshake while still varying the X509 public-key
  // types consumed by curl. Non-TLS fixed protocol lanes discard this field.
  TlsCertificateChainProfile tls_certificate_chain = 12 [
    (curl.fuzzer.schema.scenario_field) = {
      eligibility {
        profiles: TARGET_PROFILE_COMPATIBILITY
        profiles: TARGET_PROFILE_FAST_HTTPS
        profiles: TARGET_PROFILE_HTTPS_H2
        profiles: TARGET_PROFILE_FAST_HTTP3
        profiles: TARGET_PROFILE_FAST_SECURE_WEBSOCKET
      }
    }
  ];
  // Ordered HTTP/3 peer work for the dedicated QUIC lane. Keeping this in a
  // separate message lets the ordinary Connection retain its historical
  // stream-socket meaning while the H3 peer encrypts these plaintext actions
  // onto the appropriate QUIC streams. Non-H3 fixed targets discard the plan;
  // the compatibility target deliberately leaves field 13 untouched.
  Http3Plan http3_plan = 13 [
    (curl.fuzzer.schema.scenario_field) = {
      eligibility {
        profiles: TARGET_PROFILE_COMPATIBILITY
        profiles: TARGET_PROFILE_FAST_HTTP3
      }
    }
  ];
  // Enable verbose curl tracing with LIB-IDS prefixes for this scenario.
  bool trace_ids = 14 [
    (curl.fuzzer.schema.scenario_field) = {
      eligibility {
        profiles: TARGET_PROFILE_COMPATIBILITY
        profiles: TARGET_PROFILE_FAST_HTTP
        profiles: TARGET_PROFILE_DEEP_HTTP
        profiles: TARGET_PROFILE_FAST_HTTPS
        profiles: TARGET_PROFILE_HTTPS_H2
        profiles: TARGET_PROFILE_FAST_HTTP2
        profiles: TARGET_PROFILE_FAST_HTTP3
        profiles: TARGET_PROFILE_H2_PROXY
        profiles: TARGET_PROFILE_PROXY_TRANSPORT
        profiles: TARGET_PROFILE_RESOLVER
        profiles: TARGET_PROFILE_FAST_WEBSOCKET
        profiles: TARGET_PROFILE_FAST_SECURE_WEBSOCKET
        profiles: TARGET_PROFILE_FAST_TELNET
        profiles: TARGET_PROFILE_FAST_FTP
        profiles: TARGET_PROFILE_FAST_TFTP
        profiles: TARGET_PROFILE_FAST_SMTP
        profiles: TARGET_PROFILE_FAST_IMAP
        profiles: TARGET_PROFILE_FAST_POP3
        profiles: TARGET_PROFILE_FAST_MQTT
        profiles: TARGET_PROFILE_FAST_DICT
        profiles: TARGET_PROFILE_FAST_GOPHER
        profiles: TARGET_PROFILE_FAST_FILE
        profiles: TARGET_PROFILE_FAST_LDAP
        profiles: TARGET_PROFILE_FAST_RTSP
        profiles: TARGET_PROFILE_FAST_IPFS
        profiles: TARGET_PROFILE_API
        profiles: TARGET_PROFILE_MULTI
        profiles: TARGET_PROFILE_TIMING
      }
    }
  ];
  // Select the wire version and resolution side for the dedicated proxy
  // transport lane. Values zero and one retain the original SOCKS4/SOCKS4A
  // behavior of historical serialized inputs; SOCKS5 modes are append-only.
  // Other fixed targets clear this field, and the compatibility target ignores
  // it, preserving the semantics of historical serialized inputs.
  SocksProxyMode socks_proxy_mode = 15 [
    (curl.fuzzer.schema.scenario_field) = {
      eligibility {
        profiles: TARGET_PROFILE_COMPATIBILITY
        profiles: TARGET_PROFILE_PROXY_TRANSPORT
      }
    }
  ];
  // Harness-owned CURLOPT_RESOLVE entries for the dedicated resolver lane.
  // The runtime appends a fixed mapping for the requested origin after these
  // fuzzed entries so removals and wildcards cannot escape the mock transport.
  repeated bytes resolve_entries = 16 [
