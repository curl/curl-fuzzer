syntax = "proto3";

package curl.fuzzer.proto;

// Structured HTTP/WebSocket scenario description for the curl-fuzzer
// libprotobuf-mutator targets. One scenario configures a single easy handle
// and feeds one or more bounded mock connections.

message Scenario {
  // Scheme + host_path compose the request URL. Splitting them keeps the
  // mutator honest: it can vary the scheme (and therefore the dispatch path
  // in the runner) independently of the rest of the URL, without hand-rolled
  // string matching to discover ws:// vs http://.
  Scheme scheme = 1;
  // Everything after the "://" — host, optional port, and path. The runner
  // does not validate or percent-encode this; bytes land on the wire as-is.
  // Declared as `bytes` rather than `string` because a libFuzzer / LPM mutator
  // will cheerfully produce non-UTF-8 byte sequences here, and proto3's
  // `string` validator warns on those at parse time even though the bytes are
  // preserved. Using `bytes` skips the validator; curl's URL parser is happy
  // with raw bytes and will reject anything invalid itself.
  bytes host_path = 2;
  repeated SetOption options = 3;
  Connection connection = 4;
  // Request headers need pointer-valued CURLOPT_HTTPHEADER state and cannot
  // safely travel through the scalar SetOption path. The runner keeps the
  // generated curl_slist alive until the transfer has completely stopped.
  // A runtime entry/length budget prevents repeated-field mutations from
  // turning header construction into the dominant cost of a fuzz iteration.
  repeated bytes request_headers = 5;
  // Schema-native MIME reaches curl's multipart generator without teaching
  // the generic option layer about pointer ownership. This is a message (not
  // a repeated field directly on Scenario) so presence can intentionally
  // request an empty multipart body, which exercises a distinct curl path.
  MimePost mime_post = 6;
  // Fresh HTTP sockets opened by redirects, authentication retries, and
  // connection-close responses consume these scripts in order. This is a
  // repeated Connection rather than a recursive Scenario so mutations cannot
  // create unbounded transfer trees or alter easy-handle options mid-flight.
  // The HTTP runtime consumes only the first three entries (four sockets total
  // including `connection`); WebSocket targets deliberately ignore this field
  // because their manual-drive state is tied to one upgraded connection.
  repeated Connection subsequent_connections = 7;
  // Request-body callbacks need mutable cursor state that must outlive every
  // redirect/authentication retry. Keeping that state schema-native lets LPM
  // mutate short-read and rewind behaviour together with the server responses
  // that provoke it; a fixed callback can only ever cover one happy path.
  // When absent, the runtime preserves the historical deterministic 16 KiB
  // stream so old corpus entries and WebSocket upload probes retain their
  // behaviour.
  UploadScript upload = 8;
}

// A bounded source for CURLOPT_READFUNCTION. The payload and read-limit list
// are capped again by both the target postprocessor and runtime because proto
// repeated/bytes fields have no intrinsic complexity limit.
message UploadScript {
  // Binary bytes returned to curl. Unlike POSTFIELDS this remains callback
  // backed, so redirects and authentication retries exercise seek/rewind.
  bytes data = 1;
  // Per-callback maximums used in order. A zero entry means one byte: proto3
  // makes zero especially easy to mutate into, and treating it as immediate
  // EOF would hide the configured terminal outcome and all later steps.
  // Once this list is exhausted, reads use curl's requested buffer capacity.
  repeated uint32 read_sizes = 2;
  UploadTerminal terminal = 3;
  UploadSeekResult seek_result = 4;
}

// What the read callback reports after all scripted bytes have been consumed.
// PAUSE is deliberately absent: without an asynchronous resume source it
// converts a fast fuzz case into a wall-clock timeout rather than new parser
// or state-machine coverage.
enum UploadTerminal {
  UPLOAD_TERMINAL_EOF = 0;
  UPLOAD_TERMINAL_ABORT = 1;
}

// Results available to CURLOPT_SEEKFUNCTION. An OK result performs bounded
// real seeks, including rewind-to-zero, while the other values enter curl's
// fallback and terminal retry paths without consulting the filesystem.
enum UploadSeekResult {
  UPLOAD_SEEK_OK = 0;
  UPLOAD_SEEK_CANTSEEK = 1;
  UPLOAD_SEEK_FAIL = 2;
}

// A multipart request body. Runtime budgets cap both this list and the total
// number of parts constructed, since protobuf itself does not bound repeated
// field cardinality.
message MimePost {
  repeated MimePart parts = 1;
}

// One top-level MIME part. The content oneof makes mutations choose between
// ordinary data and a nested multipart instead of constructing contradictory
// content sources. Nesting is intentionally limited to one level in the
// schema: that is enough to enter curl's recursive MIME paths while preventing
// a recursively-shaped protobuf from consuming a fuzz iteration in parsing or
// destruction before curl sees it.
message MimePart {
  bytes name = 1;
  oneof content {
    bytes data = 2;
    MimeSubparts subparts = 7;
  }
  bytes filename = 3;
  bytes content_type = 4;
  MimeEncoder encoder = 5;
  repeated bytes headers = 6;
}

// The bounded nested-multipart layer. Keeping this separate from MimePost is
// what makes unbounded recursive part trees impossible at the schema level.
message MimeSubparts {
  repeated MimeDataPart parts = 1;
}

// A leaf MIME part. Leaf data is always applied, including an empty value;
// empty-body form fields are valid and cover different size/encoder handling
// from a part whose content source was never configured.
message MimeDataPart {
  bytes name = 1;
  bytes data = 2;
  bytes filename = 3;
  bytes content_type = 4;
  MimeEncoder encoder = 5;
  repeated bytes headers = 6;
}

// Restrict mutations to curl's supported transfer encoders. Arbitrary strings
// overwhelmingly exercise only curl_mime_encoder's rejection path, while an
// enum gives each real encoder enough corpus energy to reach its read/size
// implementation.
enum MimeEncoder {
  MIME_ENCODER_UNSPECIFIED = 0;
  MIME_ENCODER_BINARY = 1;
  MIME_ENCODER_8BIT = 2;
  MIME_ENCODER_7BIT = 3;
  MIME_ENCODER_BASE64 = 4;
  MIME_ENCODER_QUOTED_PRINTABLE = 5;
}

enum Scheme {
  SCHEME_UNSPECIFIED = 0;
  SCHEME_HTTP = 1;
  SCHEME_HTTPS = 2;
  SCHEME_WS = 3;
  SCHEME_WSS = 4;
}

message SetOption {
  CurlOptionId option_id = 1;
  oneof value {
    bytes  string_value = 10;
    uint64 uint_value   = 11;
    bool   bool_value   = 12;
  }
}

message Connection {
  // Bytes written to the mock server fd as soon as curl opens the socket.
  bytes initial_response = 1;
  // Subsequent chunks, each sent the next time the fd becomes readable.
  repeated bytes on_readable = 2;
  // Structured WebSocket frames. Each frame is serialised to RFC 6455 wire
  // format and pushed onto the socket in order, as an alternative to the
  // raw bytes in on_readable. Useful for scenarios where the mutator should
  // explore frame fields (opcode, flags, length) independently of payload
  // bytes. on_readable is still available for malformed / truncated frames.
  repeated WebSocketFrame server_frames = 3;
  // Deterministic backpressure knobs for the curl→mock direction. Shrink the
  // kernel recv buffer and/or cap how much the mock drains per call, to force
  // curl's send() into short-write / EAGAIN paths (ws_send_raw_blocking's
  // partial-write loop, ws_flush's CURLE_AGAIN branch, ws_enc_add_pending,
  // etc). Left at defaults (0/0) the mock drains greedily and nothing
  // backpressures — same behaviour as before this field existed.
  BackpressureConfig backpressure = 4;
  // Opt-in probes run in the CONNECT_ONLY=2 manual-drive tail. Each probe
  // targets a specific region of ws.c; default-off keeps new scenarios
  // focused on the behaviour they're exercising. Ignored when the scenario
  // isn't in manual-drive mode.
  WsManualProbes manual_probes = 5;
}

// Gates the optional client-side send probes fired from the manual-drive
// tail in WebSocketMockServer::RunLoop. All bools default to false, so
// adding this message to a scenario is purely additive — existing scenarios
// that don't set it skip every probe and simply exercise curl_ws_recv plus
// whatever raw frame bytes are queued.
message WsManualProbes {
  // Walk curl_ws_start_frame / curl_ws_send through kWsSendFlagMatrix.
  // Covers ws_frame_flags2firstbyte branches plus invalid-flag failf paths.
  bool flag_matrix = 1;
  // Declare a fragsize=200 frame, send 23 bytes, then send a 500-byte buffer
  // — trips the "unaligned frame size" guard in ws_enc_send.
  bool unaligned_send = 2;
  // curl_ws_send with flags=0, fragsize=0. In CURLWS_RAW_MODE this hits the
  // ws_raw_mode / ws_send_raw branch; otherwise it reaches the "no flags
  // given" rejection (already covered elsewhere).
  bool raw_send = 3;
}

// Tunes how aggressively the mock drains bytes curl sends it. Deterministic
// by construction: both knobs are byte-budgets, not time-budgets, so a
// scenario's kernel-buffer trajectory is a pure function of the scripted
// byte stream. The existing select() timeout in WaitOnMultiFdset remains
// the only wall-clock input to the drive loop.
message BackpressureConfig {
  // SO_RCVBUF applied to the mock-server side of the socketpair. When >0
  // this caps how many bytes curl can push into the pipe before its send()
  // short-writes or returns EAGAIN. Linux clamps below SOCK_MIN_RCVBUF
  // (~2 KB after doubling); effectively a floor around 2048.
  uint32 recv_buf_bytes = 1;
  // Upper bound on bytes drained per DrainIncoming() call. 0 = unlimited
  // (legacy behaviour). Small values keep the mock-side recv buffer full
  // so curl keeps seeing short writes across multiple loop iterations.
  uint32 drain_limit = 2;
}

// One WebSocket frame to be emitted by the mock server. Field semantics
// mirror RFC 6455 §5.2; no validation is applied — the point of the fuzzer
// is to exercise curl's parser against both well-formed and malformed
// inputs, so e.g. opcode=15 or rsv bits set will simply land on the wire.
message WebSocketFrame {
  // Final fragment bit (bit 0 of byte 0).
  bool fin = 1;
  // Reserved bits. Any non-zero value should trip the extension-negotiation
  // checks in curl's decoder.
  bool rsv1 = 2;
  bool rsv2 = 3;
  bool rsv3 = 4;
  // Opcode nibble (low 4 bits of byte 0). Values > 15 are masked to 4 bits.
  uint32 opcode = 5;
  // Mask bit + 32-bit masking key. The serializer XORs the payload if set.
  bool masked = 6;
  uint32 mask_key = 7;
  // Payload bytes (length implied — the serializer picks the narrowest
  // length encoding unless length_form overrides it).
  bytes payload = 8;
  // Force a specific length-encoding form: 0 = auto, 1 = 7-bit, 2 = 16-bit
  // (0x7E marker), 3 = 64-bit (0x7F marker). Lets scenarios exercise the
  // extended-length decode paths even for small payloads.
  uint32 length_form = 9;
}

// Populated at build time by generate_option_manifest.py. Keep the
// UNSPECIFIED entry so the raw zero tag is harmless.
enum CurlOptionId {
  CURL_OPTION_UNSPECIFIED = 0;
  // GENERATED-OPTIONS-BEGIN
  // GENERATED-OPTIONS-END
}
