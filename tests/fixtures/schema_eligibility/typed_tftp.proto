message SetOption {
  oneof setting {
    uint64 tftp_blksize = 1 [(curl.fuzzer.schema.curl_option) = {
      native_name: "CURLOPT_TFTP_BLKSIZE"
      eligibility {
        profiles: TARGET_PROFILE_COMPATIBILITY
        profiles: TARGET_PROFILE_FAST_FTP
        profiles: TARGET_PROFILE_FAST_TFTP
      }
    }];
    bool tftp_no_options = 2 [(curl.fuzzer.schema.curl_option) = {
      native_name: "CURLOPT_TFTP_NO_OPTIONS"
      eligibility {
        profiles: TARGET_PROFILE_FAST_TFTP
      }
    }];
    bytes user_agent = 3 [(curl.fuzzer.schema.curl_option) = {
      native_name: "CURLOPT_USERAGENT"
      eligibility {
        profiles: TARGET_PROFILE_FAST_HTTP
        profiles: TARGET_PROFILE_DEEP_HTTP
      }
    }];
    bytes range = 4 [(curl.fuzzer.schema.curl_option) = {
      native_name: "CURLOPT_RANGE"
      eligibility {
        profiles: TARGET_PROFILE_FAST_FTP
        profiles: TARGET_PROFILE_FAST_TFTP
        guards {
          fact: SELECTOR_FACT_IMPLICIT_FTPS
          expected: false
          profiles: TARGET_PROFILE_FAST_TFTP
        }
      }
    }];
  }
}

message Connection {
  bytes initial_response = 1 [(curl.fuzzer.schema.scenario_field) = {
    eligibility {
      profiles: TARGET_PROFILE_FAST_HTTP
      profiles: TARGET_PROFILE_DEEP_HTTP
      profiles: TARGET_PROFILE_FAST_FTP
      profiles: TARGET_PROFILE_FAST_TFTP
    }
  }];
  bytes http_only = 2 [(curl.fuzzer.schema.scenario_field) = {
    eligibility {
      profiles: TARGET_PROFILE_FAST_HTTP
      profiles: TARGET_PROFILE_DEEP_HTTP
    }
  }];
}

message SharedState {
  bytes common = 1 [(curl.fuzzer.schema.scenario_field) = {
    eligibility {
      profiles: TARGET_PROFILE_FAST_TFTP
      profiles: TARGET_PROFILE_COMPATIBILITY
      profiles: TARGET_PROFILE_TIMING
      profiles: TARGET_PROFILE_DEEP_HTTP
      profiles: TARGET_PROFILE_RESOLVER
      profiles: TARGET_PROFILE_FAST_HTTP3
    }
  }];
  bytes primary_only = 2 [(curl.fuzzer.schema.scenario_field) = {
    contextual_eligibility {
      context: "primary"
      eligibility {
        profiles: TARGET_PROFILE_FAST_TFTP
      }
    }
  }];
  bytes secondary_only = 3 [(curl.fuzzer.schema.scenario_field) = {
    contextual_eligibility {
      context: "secondary"
      eligibility {
        profiles: TARGET_PROFILE_FAST_TFTP
      }
    }
  }];
  bytes mixed_membership = 4 [(curl.fuzzer.schema.scenario_field) = {
    eligibility {
      profiles: TARGET_PROFILE_COMPATIBILITY
      profiles: TARGET_PROFILE_TIMING
    }
    contextual_eligibility {
      context: "primary"
      eligibility {
        profiles: TARGET_PROFILE_DEEP_HTTP
        profiles: TARGET_PROFILE_RESOLVER
        profiles: TARGET_PROFILE_FAST_HTTP3
        profiles: TARGET_PROFILE_FAST_TFTP
        guards {
          fact: SELECTOR_FACT_IMPLICIT_FTPS
          expected: false
          profiles: TARGET_PROFILE_FAST_TFTP
        }
      }
    }
  }];
}

message RecursiveNode {
  bytes payload = 1 [(curl.fuzzer.schema.scenario_field) = {
    eligibility {
      profiles: TARGET_PROFILE_FAST_TFTP
    }
  }];
  RecursiveNode child = 2 [(curl.fuzzer.schema.scenario_field) = {
    eligibility {
      profiles: TARGET_PROFILE_FAST_TFTP
    }
  }];
}

enum Scheme {
  SCHEME_UNSPECIFIED = 0;
  SCHEME_TFTP = 7;
  SCHEME_FTPS = 23;
}

message ChoicePayload {
  oneof choice {
    uint64 amount = 1 [(curl.fuzzer.schema.scenario_field) = {
      eligibility {
        profiles: TARGET_PROFILE_FAST_TFTP
      }
    }];
    Scheme selected_scheme = 2 [(curl.fuzzer.schema.scenario_field) = {
      eligibility {
        profiles: TARGET_PROFILE_FAST_TFTP
      }
    }];
    RecursiveNode node = 3 [(curl.fuzzer.schema.scenario_field) = {
      eligibility {
        profiles: TARGET_PROFILE_FAST_TFTP
      }
    }];
  }
}

message Scenario {
  repeated SetOption options = 1 [(curl.fuzzer.schema.scenario_field) = {
    eligibility {
      profiles: TARGET_PROFILE_COMPATIBILITY
      profiles: TARGET_PROFILE_FAST_FTP
      profiles: TARGET_PROFILE_FAST_TFTP
    }
  }];
  Connection connection = 2 [(curl.fuzzer.schema.scenario_field) = {
    eligibility {
      profiles: TARGET_PROFILE_FAST_HTTP
      profiles: TARGET_PROFILE_DEEP_HTTP
      profiles: TARGET_PROFILE_FAST_FTP
      profiles: TARGET_PROFILE_FAST_TFTP
    }
  }];
  bytes http_only = 3 [(curl.fuzzer.schema.scenario_field) = {
    eligibility {
      profiles: TARGET_PROFILE_FAST_HTTP
      profiles: TARGET_PROFILE_DEEP_HTTP
    }
  }];
  bytes host_path = 4 [(curl.fuzzer.schema.scenario_field) = {
    eligibility {
      profiles: TARGET_PROFILE_FAST_TFTP
      guards {
        fact: SELECTOR_FACT_IMPLICIT_FTPS
        expected: false
        profiles: TARGET_PROFILE_FAST_TFTP
      }
    }
  }];
  Scheme scheme = 5 [(curl.fuzzer.schema.scenario_field) = {
    eligibility {
      profiles: TARGET_PROFILE_FAST_HTTP
      profiles: TARGET_PROFILE_DEEP_HTTP
      profiles: TARGET_PROFILE_FAST_FTP
      profiles: TARGET_PROFILE_FAST_TFTP
    }
  }];
  SharedState primary_state = 6 [(curl.fuzzer.schema.scenario_field) = {
    eligibility {
      profiles: TARGET_PROFILE_FAST_TFTP
      profiles: TARGET_PROFILE_COMPATIBILITY
      profiles: TARGET_PROFILE_TIMING
      profiles: TARGET_PROFILE_DEEP_HTTP
      profiles: TARGET_PROFILE_RESOLVER
      profiles: TARGET_PROFILE_FAST_HTTP3
    }
    child_context: "primary"
  }];
  SharedState secondary_state = 7 [(curl.fuzzer.schema.scenario_field) = {
    eligibility {
      profiles: TARGET_PROFILE_FAST_TFTP
      profiles: TARGET_PROFILE_COMPATIBILITY
      profiles: TARGET_PROFILE_TIMING
      profiles: TARGET_PROFILE_DEEP_HTTP
      profiles: TARGET_PROFILE_RESOLVER
      profiles: TARGET_PROFILE_FAST_HTTP3
    }
    child_context: "secondary"
  }];
  SharedState primary_state_again = 8 [(curl.fuzzer.schema.scenario_field) = {
    eligibility {
      profiles: TARGET_PROFILE_FAST_TFTP
      profiles: TARGET_PROFILE_COMPATIBILITY
      profiles: TARGET_PROFILE_TIMING
      profiles: TARGET_PROFILE_DEEP_HTTP
      profiles: TARGET_PROFILE_RESOLVER
      profiles: TARGET_PROFILE_FAST_HTTP3
    }
    child_context: "primary"
  }];
  RecursiveNode recursive = 9 [(curl.fuzzer.schema.scenario_field) = {
    eligibility {
      profiles: TARGET_PROFILE_FAST_TFTP
    }
  }];
  ChoicePayload choice_payload = 10 [(curl.fuzzer.schema.scenario_field) = {
    eligibility {
      profiles: TARGET_PROFILE_FAST_TFTP
    }
  }];
}
